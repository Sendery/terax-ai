[package]
name = "terax-wasm-feasibility"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
libghostty-vt = { version = "=0.2.2", default-features = false }
libghostty-vt-sys = { version = "=0.2.2", default-features = false, features = ["pkg-config"] }

[patch.crates-io]
libghostty-vt-sys = { path = "target/sys" }

[profile.release]
opt-level = 3
panic = "abort"
codegen-units = 1
lto = true
